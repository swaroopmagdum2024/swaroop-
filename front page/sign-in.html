<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign In - Role Based Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Sign In</h2>
    <p id="roleDisplay"></p>
    <div id="signInMessage" style="color: red;"></div>

    <form id="signInForm">
      <input id="signInEmail" type="email" placeholder="Email" required />
      <input id="signInPassword" type="password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>

    <button id="backBtn">Back</button>

    <hr />

    <button id="googleLoginBtn">Sign in with Google</button>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID_HERE';

    const urlParams = new URLSearchParams(window.location.search);
    const selectedRole = urlParams.get('role') || 'N/A';
    document.getElementById('roleDisplay').textContent = `Role selected: ${selectedRole}`;

    function getUsers() {
      return JSON.parse(localStorage.getItem('users') || '{}');
    }

    const signInForm = document.getElementById('signInForm');
    const signInMessage = document.getElementById('signInMessage');

    signInForm.addEventListener('submit', e => {
      e.preventDefault();
      signInMessage.textContent = '';
      
      const email = document.getElementById('signInEmail').value.trim().toLowerCase();
      const password = document.getElementById('signInPassword').value;

      if (!email || !password) {
        signInMessage.textContent = 'Please fill in all fields.';
        return;
      }

      const users = getUsers();

      if (!users[email]) {
        signInMessage.textContent = 'No account found.';
        return;
      }

      if (users[email].password !== password) {
        signInMessage.textContent = 'Incorrect password.';
        return;
      }

      if (users[email].role !== selectedRole) {
        signInMessage.textContent = `Role mismatch. You registered as ${users[email].role}.`;
        return;
      }

      signInMessage.style.color = 'green';
      signInMessage.textContent = `Welcome, ${users[email].firstName} ${users[email].lastName}`;
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });

    document.getElementById('googleLoginBtn').addEventListener('click', () => {
      const redirectUri = window.location.origin + '/sign-in.html?role=' + selectedRole;
      const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=openid%20email%20profile&prompt=select_account`;
      window.location.href = authUrl;
    });
  </script>
</body>
</html>
